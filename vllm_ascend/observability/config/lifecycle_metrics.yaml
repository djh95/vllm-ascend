# RL / Lifecycle sleep-wake / update_weights / routed-experts metrics.
- symbol: vllm_ascend.worker.worker:NPUWorker.sleep
  handler: vllm_ascend.observability.handlers:worker_sleep_handler

- symbol: vllm_ascend.worker.worker:NPUWorker.wake_up
  handler: vllm_ascend.observability.handlers:worker_wake_handler

- symbol: vllm_ascend.worker.worker:NPUWorker.update_weights
  handler: vllm_ascend.observability.handlers:worker_update_weights_handler

- symbol: vllm.v1.worker.gpu_model_runner:GPUModelRunner.init_routed_experts_capturer
  handler: vllm_ascend.observability.handlers:routed_experts_init_handler
