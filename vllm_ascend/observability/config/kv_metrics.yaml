# PD KV transfer + KV Pool load/save failure metrics.
- symbol: vllm.v1.core.sched.scheduler:Scheduler.update_from_output
  handler: vllm_ascend.observability.handlers:kv_update_from_output_handler

- symbol: vllm_ascend.core.recompute_scheduler:RecomputeScheduler.update_from_output
  handler: vllm_ascend.observability.handlers:kv_update_from_output_handler

- symbol: vllm.v1.core.sched.scheduler:Scheduler._update_from_kv_xfer_finished
  handler: vllm_ascend.observability.handlers:kv_xfer_finished_handler

- symbol: vllm_ascend.distributed.kv_transfer.kv_pool.ascend_store.pool_worker:KVPoolWorker.start_load_kv
  handler: vllm_ascend.observability.handlers:kv_pool_start_load_handler

- symbol: vllm_ascend.distributed.kv_transfer.kv_pool.ascend_store.pool_worker:KVPoolWorker.get_block_ids_with_load_errors
  handler: vllm_ascend.observability.handlers:kv_pool_load_errors_handler

- symbol: vllm_ascend.distributed.kv_transfer.kv_pool.ascend_store.backend.mooncake_backend:MooncakeBackend.put
  handler: vllm_ascend.observability.handlers:kv_pool_put_failure_handler

- symbol: vllm_ascend.distributed.kv_transfer.kv_pool.ascend_store.backend.memcache_backend:MemcacheBackend.put
  handler: vllm_ascend.observability.handlers:kv_pool_put_failure_handler
