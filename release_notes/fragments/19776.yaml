pr: 19776
entries:
  - category: feature
    text: >
      Gate vLLM Ascend MS service metrics by a metric level (off, basic,
      detail, debug). The level is read from the VLLM_ASCEND_MS_METRIC_LEVEL
      environment variable and from the metrics.level runtime config key, and
      can be changed at runtime through runtime_config.json hot reload.
      Higher-level series stay unregistered until the level rises so
      high-cardinality metrics are never created implicitly.
  - category: feature
    text: >
      Add the POST /set_metrics_level endpoint to change the metric level of a
      running service. The level fans out to every EngineCore and worker and is
      persisted to runtime_config.json so a later hot reload keeps it.
  - category: feature
    text: >
      Add Ascend-owned symbol-hook metrics for scheduling and execution: the
      executor:sample_tokens:duration_ms histogram (detail level) and the
      scheduler:preempt_total counter with reason labels (basic level). No
      scheduler or model runner code is edited; the handlers only wrap existing
      symbols.
